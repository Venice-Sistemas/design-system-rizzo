name: CI

# `develop` é onde se testa. Aqui nada versiona e nada publica — isso é da
# `main` (.github/workflows/release.yml).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Um push novo na mesma branch cancela a execução anterior: o resultado dela já
# não interessa, e a fila de PRs anda mais rápido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Construir e testar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Antes do setup-node, senão `cache: pnpm` não encontra o gerenciador. A
      # versão vem do `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@venice-sistemas'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O build vem antes dos testes de propósito: o pacote de React consome o
      # `styles` pelo `dist`, e sem construir a suíte falha por artefato
      # ausente, não por divergência de componente.
      #
      # É também a verificação de tipos que o repositório tem: nenhum pacote
      # traz script `type-check` — quem checa é o `--dts` do tsup, ao emitir as
      # declarações. Um passo `type-check` aqui passaria sem verificar nada,
      # porque `pnpm -r` ignora em silêncio quem não tem o script.
      - name: Construir
        run: pnpm -r run build

      - name: Testar
        run: pnpm -r run test
