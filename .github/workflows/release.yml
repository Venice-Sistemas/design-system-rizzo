name: Release

# Publicar é o que acontece quando `develop` entra em `main`. Preparar a versão
# é outra coisa, e acontece antes (.github/workflows/version.yml).
on:
  push:
    branches: [main]

# Sem `cancel-in-progress`: cancelar no meio de um `changeset publish` deixa
# parte dos pacotes publicada e parte não, e versão publicada não volta atrás.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  # Empurrar as tags que o `changeset publish` cria.
  contents: write
  # Publicar no GitHub Packages. É o que substitui o PAT pessoal: o
  # GITHUB_TOKEN alcança os pacotes deste repositório sem credencial de ninguém.
  packages: write

jobs:
  release:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: pnpm
          # Escreve um .npmrc temporário com o token; o .npmrc versionado, que
          # define o registry do escopo, continua valendo.
          registry-url: https://npm.pkg.github.com
          scope: '@venice-sistemas'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `release` é o script do repositório (`build` de todos os pacotes +
      # `changeset publish`), não um comando próprio deste arquivo: o que roda
      # aqui é o mesmo que se roda na máquina.
      #
      # É idempotente por natureza — o `changeset publish` compara com o
      # registro e não republica o que já está lá. Merge em `main` sem versão
      # nova simplesmente não publica nada.
      - name: Construir e publicar
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O `changeset publish` cria as tags localmente e não as envia. Sem este
      # passo o pacote sai publicado e o repositório fica sem a marca de qual
      # commit gerou aquela versão.
      - name: Enviar as tags
        run: git push --follow-tags
