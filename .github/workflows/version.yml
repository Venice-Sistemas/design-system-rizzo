name: Versão

# `develop` acumula o trabalho. Aqui a versão é só **preparada** — nada é
# publicado. A publicação acontece em `main` (.github/workflows/release.yml).
on:
  push:
    branches: [develop]

concurrency:
  group: version-develop
  cancel-in-progress: true

permissions:
  contents: write
  # Abrir e atualizar a PR "Version Packages".
  pull-requests: write

jobs:
  version:
    name: Preparar a versão
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          # O changesets compara com a base para saber quais pacotes mudaram;
          # com o histórico raso ele não enxerga nada.
          fetch-depth: 0

      # Antes do setup-node, senão `cache: pnpm` não encontra o gerenciador. A
      # versão vem do `packageManager` do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@venice-sistemas'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Testar
        run: pnpm -r run test

      # Sem o campo `publish`: esta ação só abre e mantém a PR "Version
      # Packages". Quem publica é a `main` — é o que separa "a versão está
      # pronta" de "a versão foi ao ar".
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'chore: prepara a versao dos pacotes'
          title: 'chore: versao dos pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
